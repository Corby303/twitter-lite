name: Test and build MVP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run automated tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build Docker image
        run: docker compose build
      - name: Start and check container health
        run: docker compose up -d --wait --wait-timeout 90
      - name: Test real HTTP journeys and persistence in Docker
        run: python scripts/docker_smoke.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
