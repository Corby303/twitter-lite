<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Community feed{% endblock %} | Twitter Lite</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('posts.feed') }}"><span class="brand-mark">t</span> Twitter Lite</a>
      <nav aria-label="Main navigation">
        {% if g.user %}
          <span class="signed-in">@{{ g.user['username'] }}</span>
          <form action="{{ url_for('auth.logout') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="button button-quiet" type="submit">Sign out</button>
          </form>
        {% else %}
          <a class="nav-link" href="{{ url_for('auth.login') }}">Sign in</a>
          <a class="button button-small" href="{{ url_for('auth.register') }}">Create account</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main id="main" class="main-container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="notice notice-{{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Software Engineering Workshop &middot; Local MVP</footer>
</body>
</html>
