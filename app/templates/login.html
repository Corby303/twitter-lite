{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card auth-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Good to see you.</h1><p class="muted">Sign in to share an update with your community.</p>
  {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ username }}" required maxlength="30" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
    <button class="button button-full" type="submit">Sign in</button>
  </form>
  <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
